name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virtual_employee_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virtual_employee_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_CONNECTION_STRING: Host=localhost;Port=5432;Database=virtual_employee_tests;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VirtualEmployee.slnx

      - name: Build
        run: dotnet build VirtualEmployee.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VirtualEmployee.slnx --configuration Release --no-build --verbosity normal
