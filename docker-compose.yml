services:
  postgres:
    image: postgres:18
    container_name: virtual-employee-postgres
    environment:
      POSTGRES_DB: virtual_employee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - virtual_employee_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_employee"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  virtual_employee_postgres_data: